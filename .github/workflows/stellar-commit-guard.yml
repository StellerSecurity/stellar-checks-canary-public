# Stellar release 20260916: source + exact dependency archive inspection.
# Stellar commit guard v1.0.0. Trusted inline code; no checkout or installation.
name: Repository commit guard
run-name: Commit guard ${{ inputs.request_id }} ${{ inputs.target_sha }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact repository commit to inspect as data
        required: true
        type: string
      request_id:
        description: Durable queue request identifier
        required: true
        type: string
permissions:
  contents: read
  checks: write
jobs:
  scan:
    name: Repository commit guard execution
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Read exact commit and inspect source and lifecycle scripts
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -B - scan <<'STELLAR_COMMIT_GUARD_PY'
          """Stellar source guard. Python standard library only; source is never executed."""
          import base64
          import collections
          import hashlib
          import http.client
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          import zlib
          
          VERSION = '2.1.0'
          CHECK_NAME = 'Repository source guard'
          WORKFLOW_PATH = '.github/workflows/stellar-source-guard.yml'
          MAX_FILE = 2_000_000
          SOURCE = re.compile(r'\.(js|jsx|mjs|cjs|ts|tsx|vue|svelte|html?|php|phtml|py|pyw|sh|bash|zsh|fish|ps1|psm1|bat|cmd|vbs|hta|wsf|cs|csproj|fsproj|props|targets|config|json|ya?ml|toml|gradle|kts|kt|java|swift|dart|go|mod|sum|rs|rb|podspec|pl|lua|groovy|c|cc|cpp|h|hpp|xml|mk|cmake|properties|lock|sql|plist|policy|desktop|service|socket|entitlements|xcconfig|pbxproj|bp|rc|conf|ini|nsi|nsh|iss|wxs|wxi)$', re.I)
          CODE = re.compile(r'\.(js|jsx|mjs|cjs|ts|tsx|vue|svelte|html?|py|pyw|php|phtml|sh|bash|zsh|fish|ps1|psm1|bat|cmd|vbs|hta|rb|pl|lua|groovy|rs|java|kt|kts|cs|swift|dart|go|c|cc|cpp|h|hpp)$', re.I)
          SPECIAL = {'Dockerfile', 'Makefile', 'Gemfile', 'Podfile', 'Podfile.lock', 'Package.resolved', 'gradlew', 'mvnw', '.gitmodules', '.npmrc', '.yarnrc', 'requirements.txt', 'CMakeLists.txt', 'Jenkinsfile'}
          SENSITIVE = re.compile(r'(^|/)(\.env($|\.)|id_(rsa|ed25519)|[^/]*\.(pem|p12|pfx|jks|keystore|key)$|google-services\.json$|GoogleService-Info\.plist$|appsettings[^/]*\.json$|[^/]*(credentials|service.account)[^/]*\.json$)', re.I)
          ECOSYSTEMS = {'npm': 'npm', 'Packagist': 'composer', 'crates.io': 'rust', 'PyPI': 'pip', 'Maven': 'maven', 'Go': 'go', 'NuGet': 'nuget', 'SwiftURL': 'swift', 'RubyGems': 'rubygems'}
          DECODE_LIMIT = 262144
          DECODE_TOTAL = 1048576
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Unexpected API redirect')
          
          
          class API:
              def __init__(self, token):
                  self.token = token
                  self.opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect)
          
              def call(self, url, data=None, method=None):
                  host = urllib.parse.urlsplit(url).netloc
                  if host != 'api.github.com' or not url.startswith('https://'):
                      raise RuntimeError('API host is not allowed')
                  headers = {'User-Agent': 'Stellar-Source-Guard/' + VERSION, 'Content-Type': 'application/json'}
                  if host == 'api.github.com':
                      headers.update({'Authorization': 'Bearer ' + self.token, 'X-GitHub-Api-Version': '2022-11-28'})
                  request = urllib.request.Request(url, data=None if data is None else json.dumps(data).encode(), headers=headers, method=method)
                  for attempt in range(3):
                      try:
                          with self.opener.open(request, timeout=45) as response:
                              result = json.load(response)
                          if isinstance(result, dict) and result.get('errors'):
                              raise RuntimeError('GraphQL returned an incomplete result')
                          return result
                      except (urllib.error.URLError, TimeoutError, http.client.RemoteDisconnected, http.client.IncompleteRead, ConnectionResetError):
                          if attempt == 2:
                              raise RuntimeError('GitHub API request failed') from None
                          time.sleep(2 ** attempt)
          
              def gh(self, path, data=None, method=None):
                  return self.call('https://api.github.com/' + path, data, method)
          
          
          def git_hash(data):
              return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          
          
          def selected(entry):
              path = entry['path']
              base = path.rsplit('/', 1)[-1]
              return entry['type'] == 'blob' and not SENSITIVE.search(path) and (SOURCE.search(path) or base in SPECIAL or re.fullmatch(r'(?:requirements|constraints)[^/]*\.txt', base) or entry.get('mode') == '100755')
          
          
          def normalize_literals(text):
              """Only transform ASCII escapes and adjacent simple string literals as data."""
              text = re.sub(r'\\(?:x([0-9a-fA-F]{2})|u([0-9a-fA-F]{4}))',
                            lambda m: chr(int(m[1] or m[2], 16)) if 32 <= int(m[1] or m[2], 16) < 127 else m[0], text)
              adjacent = re.compile(r'''(["'])([A-Za-z0-9_./:-]{1,100})\1\s*\+\s*(["'])([A-Za-z0-9_./:-]{1,100})\3''')
              for _ in range(8):
                  changed = adjacent.sub(lambda m: m[1] + m[2] + m[4] + m[1], text)
                  if changed == text:
                      break
                  text = changed
              return text
          
          
          def decoded_literals(text):
              """Bounded literal-only decoding. Never evaluate expressions or execute output."""
              count, total = 0, 0
              pattern = re.compile(r'''["']([A-Za-z0-9+/=_-]{80,350000})["']''')
              for m in pattern.finditer(text):
                  count += 1
                  if count > 32 or total >= DECODE_TOTAL:
                      break
                  value = m[1]
                  try:
                      if re.fullmatch(r'(?:[0-9a-fA-F]{2}){40,}', value):
                          raw = bytes.fromhex(value)
                      else:
                          raw = base64.b64decode(value + '=' * (-len(value) % 4), altchars=b'-_', validate=True)
                      if len(raw) > DECODE_LIMIT:
                          continue
                      if raw.startswith((b'\x1f\x8b', b'x\x9c', b'x\xda', b'x\x01')):
                          stream = zlib.decompressobj(47)
                          raw = stream.decompress(raw, DECODE_LIMIT + 1)
                          if len(raw) > DECODE_LIMIT or not stream.eof:
                              continue
                      total += len(raw)
                      value = raw.decode('utf-8')
                      if value and sum(ch.isprintable() or ch in '\r\n\t' for ch in value) / len(value) > 0.95:
                          yield text.count('\n', 0, m.start()) + 1, value
                  except (ValueError, UnicodeError, zlib.error):
                      continue
          
          
          def behavior_rules(path, text):
              """Heuristic correlations are review warnings; narrow execution patterns block."""
              found = []
              def add(rule, level, match=None):
                  found.append({'path': path, 'rule': rule, 'level': level,
                                'line': 1 if match is None else text.count('\n', 0, match.start()) + 1})
              strong = {
                  'encoded-function-execution': r'\b(?:new\s+)?Function\s*\(\s*(?:atob|Buffer\.from|base64_decode)\s*\(',
                  'remote-response-evaluation': r'\.then\s*\(\s*(?:eval|exec)\s*\)',
                  'shell-reverse-connection': r'\b(?:ba|z)?sh\s+-i\s*(?:>&|[12]>)[^\n]{0,80}/dev/tcp/',
                  'powershell-encoded-execution': r'\b(?:powershell|pwsh)(?:\.exe)?\b[^\n]{0,160}\s-(?:enc|encodedcommand)\s+[A-Za-z0-9+/]{40,}',
                  'php-request-shell-execution': r'\b(?:system|shell_exec|passthru|exec)\s*\(\s*\$_(?:GET|POST|REQUEST|COOKIE)\s*\[',
              }
              for rule, pattern in strong.items():
                  m = re.search(pattern, text, re.I)
                  if m:
                      add(rule, 'error', m)
              # A small, explicit assignment-to-sink relationship; not general data-flow analysis.
              bindings = re.finditer(r'\b([A-Za-z_$][\w$]{0,79})\s*=\s*(?:atob|Buffer\.from|base64\.b64decode|base64_decode)\s*\([^\n;]{1,1500}', text)
              for m in bindings:
                  if re.search(r'\b(?:eval|exec|Function)\s*\(\s*' + re.escape(m[1]) + r'\s*\)', text[m.end():m.end() + 3000]):
                      add('decoded-variable-execution', 'error', m)
              network = re.search(r'\b(?:fetch|https?\.\w+|requests\.\w+|urlopen|WebClient|HttpClient|axios\.\w+|curl|wget)\b', text)
              process = re.search(r'\b(?:child_process|execSync|spawnSync|subprocess|ProcessBuilder|Process\.Start|shell_exec|os\.system|Command::new|Runtime\.getRuntime)\b', text)
              dynamic = re.search(r'\b(?:eval|Function)\s*\(|\bvm\.runIn(?:New|This)Context\s*\(', text)
              secrets = re.search(r'Login Data|Local State|Cookies(?:\.sqlite)?|logins\.json|key4\.db|\.ssh[\\/]|\.aws[\\/]|\.azure[\\/]|\.gnupg[\\/]|Chrome[/\\].*User Data|wallet\.dat|keychain-db', text, re.I)
              reads = re.search(r'\b(?:readFile(?:Sync)?|read_bytes|read_text|open|ReadAllBytes|ReadAllText|sqlite3|readdir(?:Sync)?)\s*\(', text)
              if network and dynamic:
                  add('network-and-dynamic-execution-review', 'warning', dynamic)
              if secrets and reads:
                  add('credential-or-browser-file-access-review', 'warning', secrets)
                  if network:
                      add('credential-access-and-network-review', 'warning', secrets)
              if network and re.search(r'\b(?:zipfile|archiver|tarfile|JSZip|Compress-Archive)\b', text):
                  add('archive-and-network-review', 'warning', network)
              persistence = re.search(r'LaunchAgents|LaunchDaemons|launchctl|CurrentVersion[\\/]+Run\b|schtasks\b|crontab\b|systemctl\s+enable', text, re.I)
              if persistence and process:
                  add('persistence-and-process-review', 'warning', persistence)
              if re.search(r'process\.env\s*\)|JSON\.stringify\s*\(\s*process\.env|dict\s*\(\s*os\.environ', text) and network:
                  add('environment-collection-and-network-review', 'warning', network)
              if re.search(r'\b(?:eth_getTransaction|eth_call|getTransactionReceipt)\b', text) and dynamic and process:
                  add('blockchain-addressed-loader-review', 'error', dynamic)
              if re.search(r'\bos\.dup2\s*\(', text) and re.search(r'\bsocket\s*\(', text) and process:
                  add('socket-shell-redirection', 'error')
              return found
          
          
          def ci_rules(path, text):
              if not (path.startswith('.github/workflows/') and path.endswith(('.yml', '.yaml'))):
                  return []
              found = []
              def add(rule, level, line=1):
                  found.append({'path': path, 'rule': rule, 'level': level, 'line': line})
              untrusted = r'\$\{\{\s*github\.(?:event\.(?:pull_request\.(?:title|body|head\.(?:ref|label))|issue\.(?:title|body)|comment\.body|head_commit\.message)|head_ref)\b'
              run_indent = None
              for number, line in enumerate(text.splitlines(), 1):
                  indent = len(line) - len(line.lstrip())
                  is_run = re.match(r'\s*(?:-\s*)?run\s*:', line)
                  if run_indent is not None and line.strip() and indent <= run_indent:
                      run_indent = None
                  if is_run:
                      run_indent = indent + (2 if line.lstrip().startswith('-') else 0)
                  if (is_run or run_indent is not None) and re.search(untrusted, line):
                      add('ci-untrusted-expression-in-shell', 'error', number)
                  action = re.match(r'\s*(?:-\s*)?uses:\s*["\x27]?([^\s"\x27#]+)', line)
                  if action and not action[1].startswith('./'):
                      ref = action[1]
                      pinned = bool(re.search(r'@[0-9a-fA-F]{40}$', ref) or re.search(r'@sha256:[0-9a-fA-F]{64}$', ref))
                      if not pinned:
                          add('ci-action-not-immutable-review', 'warning', number)
                  if re.search(r'permissions:\s*write-all\b', line):
                      add('ci-broad-write-permissions-review', 'warning', number)
                  if re.search(r'persist-credentials:\s*true\b', line):
                      add('ci-persisted-checkout-credentials-review', 'warning', number)
              if re.search(r'\bpull_request_target\b', text) and re.search(r'^\s*(?:-\s*)?uses:\s*["\x27]?actions/checkout@', text, re.M):
                  if re.search(r'\$\{\{\s*github\.event\.pull_request\.(?:head|merge_commit_sha)', text):
                      add('ci-privileged-untrusted-checkout', 'error')
              return found
          
          
          def source_rules(path, text, _depth=0, _budget=None):
              """Return labels and positions, never echo repository-controlled source."""
              found = []
              if _budget is None:
                  _budget = [DECODE_TOTAL, 32]
              if CODE.search(path):
                  text = normalize_literals(text)
              def add(rule, level, match=None):
                  found.append({'path': path, 'rule': rule, 'level': level, 'line': 1 if match is None else text.count('\n', 0, match.start()) + 1})
              if CODE.search(path):
                  obfuscated = len(re.findall(r'\b_0x[0-9a-f]{3,}\b', text, re.I))
                  if obfuscated >= 30:
                      add('obfuscated-code', 'error')
                  patterns = {
                      'encoded-code-execution': r'\b(?:eval|exec)\s*\(\s*(?:(?:Buffer\.from|atob|base64\.b64decode|marshal\.loads)\s*\()',
                      'php-encoded-execution': r'\beval\s*\(\s*(?:base64_decode|gzinflate|gzuncompress|str_rot13)\s*\(',
                      'hidden-node-process': r'\bspawn\s*\(\s*[\x22\x27]node[\x22\x27]\s*,\s*\[\s*[\x22\x27]-e[\x22\x27]',
                  }
                  for name, pattern in patterns.items():
                      m = re.search(pattern, text, re.I)
                      if m:
                          add(name, 'error', m)
                  m = re.search(r'global\s*\.\s*i\s*=\s*[\x22\x27]A9-\d+', text)
                  if m:
                      add('known-loader-marker', 'error', m)
                  if re.search('[\u202a-\u202e\u2066-\u2069]', text):
                      add('directional-controls-in-code', 'warning')
                  if re.search(r'(?:[A-Za-z0-9+/]{1500,}={0,2}|(?:\\x[0-9a-fA-F]{2}){100,})', text):
                      add('encoded-data-review', 'warning')
                  found.extend(behavior_rules(path, text))
                  if _depth < 2:
                      for line, decoded in decoded_literals(text):
                          size = len(decoded.encode())
                          if size > _budget[0] or _budget[1] <= 0:
                              break
                          _budget[0] -= size
                          _budget[1] -= 1
                          for f in source_rules(path, decoded, _depth + 1, _budget):
                              # The position is the encoded literal, not an invented source line.
                              found.append(dict(f, line=line, rule='decoded-content:' + f['rule']))
              if path.endswith(('.sh', '.bash', '.ps1', '.yml', '.yaml', 'Dockerfile')):
                  m = re.search(r'\b(?:curl|wget)\b[^\n]{0,300}\|\s*(?:sudo\s+)?(?:ba|z|fi)?sh\b|\b(?:iex|Invoke-Expression)\s*\(?\s*(?:iwr|Invoke-WebRequest)', text, re.I)
                  if m:
                      add('remote-script-execution-review', 'warning', m)
              found.extend(ci_rules(path, text))
              if path.rsplit('/', 1)[-1] == '.npmrc' and re.search(r'(?m)^\s*ignore-scripts\s*=\s*false\s*$', text):
                  add('npm-install-scripts-explicitly-enabled-review', 'warning')
              return found
          
          
          def dependencies(path, text):
              base = path.rsplit('/', 1)[-1]
              deps, warnings = set(), []
              def dep(eco, name, version):
                  if not isinstance(name, str) or not isinstance(version, str):
                      return
                  version = version.lstrip('v')
                  if re.fullmatch(r'\d+(?:\.\d+)*(?:[-+][\w.-]+)?', version) and re.fullmatch(r'[@\w./:-]+', name):
                      deps.add((eco, name, version))
              def warn(rule):
                  warnings.append({'path': path, 'rule': rule, 'level': 'warning', 'line': 1})
              if base == 'package.json':
                  d = json.loads(text)
                  for kind in ('dependencies', 'devDependencies', 'optionalDependencies'):
                      for n, v in d.get(kind, {}).items():
                          dep('npm', n, v)
                  for name in ('preinstall', 'install', 'postinstall', 'prepare', 'prepublish', 'prepublishOnly', 'dependencies'):
                      if d.get('scripts', {}).get(name):
                          warn('lifecycle-script-review:' + name)
                          command = d['scripts'][name]
                          if not isinstance(command, str):
                              raise ValueError('Invalid lifecycle script')
                          for finding in source_rules('lifecycle.js', command):
                              warnings.append(dict(finding, path=path, line=1, rule='lifecycle:' + name + ':' + finding['rule']))
                          if re.search(r'\b(?:curl|wget)\b[^\n]{0,400}\|\s*(?:ba|z)?sh\b', command):
                              warnings.append({'path': path, 'rule': 'lifecycle-remote-shell-execution:' + name, 'level': 'error', 'line': 1})
                  for kind in ('dependencies', 'devDependencies', 'optionalDependencies'):
                      for n, v in d.get(kind, {}).items():
                          if isinstance(v, str) and re.match(r'(?:git\+|https?://|github:)', v):
                              warn('dependency-remote-source-review:' + n)
              elif base in ('package-lock.json', 'npm-shrinkwrap.json'):
                  d = json.loads(text)
                  for loc, item in d.get('packages', {}).items():
                      if not loc or item.get('link'):
                          continue
                      # Only public registry dependency coordinates leave GitHub for OSV.
                      url = item.get('resolved', '')
                      if item.get('hasInstallScript'):
                          warn('dependency-install-script-review:' + loc.rsplit('node_modules/', 1)[-1])
                      if url.startswith('https://registry.npmjs.org/') and not item.get('integrity'):
                          warn('dependency-integrity-missing-review:' + loc.rsplit('node_modules/', 1)[-1])
                      if url and not url.startswith('https://registry.npmjs.org/'):
                          warn('nonstandard-package-source')
                          continue
                      if 'node_modules/' in loc:
                          dep('npm', item.get('name') or loc.rsplit('node_modules/', 1)[-1], item.get('version'))
                  def old(items):
                      for n, item in items.items():
                          if isinstance(item, dict):
                              if not item.get('resolved') or item['resolved'].startswith('https://registry.npmjs.org/'):
                                  dep('npm', n, item.get('version'))
                              old(item.get('dependencies', {}))
                  old(d.get('dependencies', {}))
              elif base == 'composer.lock':
                  d = json.loads(text)
                  for item in d.get('packages', []) + d.get('packages-dev', []):
                      dep('Packagist', item.get('name'), item.get('version'))
                      if item.get('type') == 'composer-plugin':
                          warn('composer-plugin-review')
              elif base == 'composer.json':
                  d = json.loads(text)
                  if d.get('scripts'):
                      warn('composer-scripts-review')
                  if d.get('repositories'):
                      warn('composer-custom-repositories-review')
              elif base == 'Cargo.lock':
                  for block in text.split('[[package]]')[1:]:
                      n = re.search(r'^name = "([^"]+)"', block, re.M)
                      v = re.search(r'^version = "([^"]+)"', block, re.M)
                      if n and v and 'registry+' in block:
                          dep('crates.io', n[1], v[1])
              elif base.startswith(('requirements', 'constraints')) and base.endswith('.txt'):
                  for m in re.finditer(r'^([\w.-]+)==([\w.+-]+)', text, re.M):
                      dep('PyPI', m[1], m[2])
              elif base in ('poetry.lock', 'uv.lock'):
                  # Read only the simple name/version fields, never interpret TOML as code.
                  for block in text.split('[[package]]')[1:]:
                      n = re.search(r'^name\s*=\s*"([^"]+)"', block, re.M)
                      v = re.search(r'^version\s*=\s*"([^"]+)"', block, re.M)
                      if n and v and not re.search(r'\b(?:editable|virtual|path|git)\s*=', block):
                          dep('PyPI', n[1], v[1])
              elif base in ('packages.lock.json', 'project.assets.json'):
                  d = json.loads(text)
                  if base == 'packages.lock.json':
                      for framework in d.get('dependencies', {}).values():
                          for name, item in framework.items():
                              if item.get('type', '').lower() != 'project':
                                  dep('NuGet', name, item.get('resolved'))
                  else:
                      for name_version, item in d.get('libraries', {}).items():
                          if item.get('type') == 'package' and '/' in name_version:
                              n, v = name_version.rsplit('/', 1)
                              dep('NuGet', n, v)
              elif base == 'packages.config' or base.endswith(('.csproj', '.fsproj')) or base == 'Directory.Packages.props':
                  if '<!DOCTYPE' in text.upper() or '<!ENTITY' in text.upper():
                      warn('xml-doctype-review')
                  else:
                      root = ET.fromstring(text)
                      for item in root.iter():
                          tag = item.tag.rsplit('}', 1)[-1]
                          if tag in ('PackageReference', 'PackageVersion', 'package'):
                              version = item.get('Version') or item.get('version')
                              if version is None:
                                  version = next((child.text for child in item if child.tag.rsplit('}', 1)[-1] == 'Version'), None)
                              dep('NuGet', item.get('Include') or item.get('Update') or item.get('id'), version)
              elif base == 'Gemfile.lock':
                  for m in re.finditer(r'^    ([A-Za-z0-9_-]+) \(([0-9][^ )]*)\)', text, re.M):
                      dep('RubyGems', m[1], m[2])
              elif base == 'yarn.lock':
                  names = []
                  for line in text.splitlines():
                      if line and not line.startswith((' ', '#')) and line.endswith(':'):
                          names = [x.strip(' "').rsplit('@', 1)[0] for x in line[:-1].split(',')]
                      m = re.match(r'\s+version[: ]+\s*[\x22\x27]?([^\x22\x27\s]+)', line)
                      if m:
                          for name in names:
                              dep('npm', name, m[1])
              elif base == 'pnpm-lock.yaml':
                  for m in re.finditer(r'^  [\x22\x27]?/?(@?[^\s:\x22\x27]+?)@([0-9][^\s:\x22\x27]*)[\x22\x27]?:', text, re.M):
                      dep('npm', m[1], m[2].split('(')[0])
              elif base in ('go.mod', 'go.sum'):
                  for m in re.finditer(r'^\s*([^\s]+)\s+v(\d[^\s/]+)', text, re.M):
                      dep('Go', m[1], m[2])
              elif base == 'Package.resolved':
                  d = json.loads(text)
                  for pin in d.get('pins', d.get('object', {}).get('pins', [])):
                      dep('SwiftURL', pin.get('location') or pin.get('repositoryURL'), pin.get('state', {}).get('version'))
              if base.endswith(('.gradle', '.gradle.kts', '.toml')):
                  for m in re.finditer(r'[\x22\x27]([\w.-]+:[\w.-]+):(\d[^\x22\x27\s]+)[\x22\x27]', text):
                      dep('Maven', m[1], m[2])
              if base.endswith('.versions.toml'):
                  versions, section = {}, ''
                  for line in text.splitlines():
                      if line.strip().startswith('['):
                          section = line.strip()
                      elif section == '[versions]':
                          m = re.match(r'\s*([\w.-]+)\s*=\s*"([^"]+)"', line)
                          if m:
                              versions[m[1]] = m[2]
                      elif section == '[libraries]':
                          kv = dict(re.findall(r'([\w.]+)\s*=\s*"([^"]+)"', line))
                          dep('Maven', kv.get('module') or (kv.get('group', '') + ':' + kv.get('name', '')), kv.get('version') or versions.get(kv.get('version.ref', '')))
              return deps, warnings
          
          
          def read_sources(api, repo, sha, tree=None, paths=None):
              if tree is None:
                  tree = api.gh('repos/' + repo + '/git/trees/' + sha + '?recursive=1')
              if tree.get('truncated'):
                  raise RuntimeError('Repository tree is truncated; scan cannot be complete')
              grouped = collections.defaultdict(list)
              skipped = collections.Counter()
              for e in tree['tree']:
                  if paths is not None and e['path'] not in paths:
                      continue
                  if not selected(e):
                      skipped['not-selected'] += e['type'] != 'tree'
                  elif e.get('size', 0) > MAX_FILE:
                      skipped['oversize'] += 1
                      yield e, None, 'oversize'
                  elif e.get('mode') == '120000':
                      skipped['symlink'] += 1
                      yield e, None, 'symlink'
                  else:
                      grouped[e['sha']].append(e)
              hashes = list(grouped)
              owner, name = repo.split('/')
              for offset in range(0, len(hashes), 30):
                  batch = hashes[offset:offset + 30]
                  fields = ['b%d:object(oid:%s){... on Blob{text isBinary byteSize}}' % (i, json.dumps(h)) for i, h in enumerate(batch)]
                  query = 'query{repository(owner:%s,name:%s){%s}}' % (json.dumps(owner), json.dumps(name), ' '.join(fields))
                  result = api.gh('graphql', {'query': query})['data']['repository']
                  for i, h in enumerate(batch):
                      b = result['b%d' % i]
                      if b is None:
                          raise RuntimeError('Missing source blob')
                      if b.get('isBinary'):
                          for e in grouped[h]:
                              yield e, None, 'binary'
                          continue
                      raw = None if b.get('text') is None else b['text'].encode()
                      if raw is None or git_hash(raw) != h:
                          blob = api.gh('repos/' + repo + '/git/blobs/' + h)
                          if blob.get('encoding') != 'base64':
                              raise RuntimeError('Unknown source encoding')
                          raw = base64.b64decode(blob['content'])
                      if git_hash(raw) != h:
                          raise RuntimeError('Source hash verification failed')
                      for e in grouped[h]:
                          if b'\0' in raw[:4096]:
                              yield e, None, 'binary'
                          elif raw.startswith(b'version https://git-lfs.github.com/spec/v1'):
                              yield e, None, 'lfs-content'
                          else:
                              yield e, raw.decode('utf-8', errors='replace'), None
                  print('Verified source groups: %d/%d' % (min(offset + 30, len(hashes)), len(hashes)), flush=True)
              print('Excluded file counts: ' + json.dumps(dict(skipped)), flush=True)
          
          
          def advisory_scan(api, deps):
              """No external coordinate queries; delegated to verified public-package analysis.
          
              Coordinates parsed from private repository manifests remain local to this
              GitHub job. The separate package-content worker first verifies public registry
              provenance before it sends any exact public coordinate to advisory services.
              """
              return set(), set()
          
          
          def markdown_safe(value):
              # Do not allow repository filenames to inject markdown or workflow commands.
              value = json.dumps(value, ensure_ascii=True)
              for char in '`<>[]()!*_':
                  value = value.replace(char, '\\u%04x' % ord(char))
              return value
          
          
          def dependency_file(path):
              base = path.rsplit('/', 1)[-1]
              return base in ('package.json', 'package-lock.json', 'npm-shrinkwrap.json', 'composer.json', 'composer.lock', 'Cargo.lock', 'Gemfile.lock', 'yarn.lock', 'pnpm-lock.yaml', 'poetry.lock', 'uv.lock', 'packages.lock.json', 'project.assets.json', 'packages.config', 'Directory.Packages.props', 'Package.resolved', 'go.mod', 'go.sum') or base.endswith(('.csproj', '.fsproj', '.gradle', '.gradle.kts', '.versions.toml')) or bool(re.fullmatch(r'(?:requirements|constraints)[^/]*\.txt', base))
          
          
          def run(api, repo, sha, event):
              findings, deps, scanned = [], set(), 0
              tree = api.gh('repos/' + repo + '/git/trees/' + sha + '?recursive=1')
              if tree.get('truncated'):
                  raise RuntimeError('Repository tree is truncated')
              entries = {e['path']: e for e in tree['tree'] if e['type'] != 'tree'}
              for e in entries.values():
                  if e['type'] == 'commit':
                      findings.append({'path': e['path'], 'rule': 'submodule-content-not-scanned-review', 'level': 'warning', 'line': 1})
              base_sha = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before')
              before, changed, previous = None, set(), {}
              if base_sha and re.fullmatch(r'[0-9a-f]{40}', base_sha) and base_sha != '0' * 40:
                  before = api.gh('repos/' + repo + '/git/trees/' + base_sha + '?recursive=1')
                  if before.get('truncated'):
                      raise RuntimeError('Baseline tree is truncated')
                  previous = {e['path']: e for e in before['tree'] if e['type'] != 'tree'}
                  changed = {p for p in set(entries) | set(previous) if (entries.get(p, {}).get('sha'), entries.get(p, {}).get('mode')) != (previous.get(p, {}).get('sha'), previous.get(p, {}).get('mode'))}
              changed_deps = set()
              for entry, text, issue in read_sources(api, repo, sha, tree=tree):
                  path = entry['path']
                  if issue:
                      level = 'error' if CODE.search(path) and issue != 'symlink' else 'warning'
                      findings.append({'path': path, 'rule': 'unscanned-' + issue, 'level': level, 'line': 1})
                      continue
                  scanned += 1
                  findings.extend(source_rules(path, text))
                  extracted, warnings = dependencies(path, text)
                  deps.update(extracted)
                  if path in changed:
                      changed_deps.update(extracted)
                  findings.extend(warnings)
              # A PR must not silently weaken the trusted workflow which scans it.
              if event.get('pull_request'):
                  if before is None:
                      raise RuntimeError('Missing PR baseline')
                  if previous.get(WORKFLOW_PATH, {}).get('sha') != entries.get(WORKFLOW_PATH, {}).get('sha'):
                      findings.append({'path': WORKFLOW_PATH, 'line': 1, 'level': 'error', 'rule': 'guard-policy-change-requires-maintainer-review'})
              # Compare only relevant old files, while the entire selected candidate is scanned above.
              old_rules, old_deps = set(), set()
              compare_paths = ({f['path'] for f in findings} | {p for p in changed if dependency_file(p)}) & changed
              if before is not None:
                  for entry, text, issue in read_sources(api, repo, base_sha, tree=before, paths=compare_paths):
                      if issue:
                          continue
                      old = source_rules(entry['path'], text)
                      extracted, warnings = dependencies(entry['path'], text)
                      old_deps.update(extracted)
                      old_rules.update((f['path'], f['rule']) for f in old + warnings)
                  for f in findings:
                      f['introduced'] = f['path'] in changed and (f['path'], f['rule']) not in old_rules
                  for eco, name, version in sorted(changed_deps - old_deps):
                      findings.append({'path': 'changed dependency manifests', 'line': 1, 'level': 'warning',
                                       'introduced': True, 'rule': 'new-dependency-version-review:' + eco + ':' + name + '@' + version})
              ids, malicious = advisory_scan(api, deps)
              for advisory in sorted(malicious):
                  findings.append({'path': 'dependency manifests', 'line': 1, 'level': 'error', 'rule': 'known-malicious-dependency:' + advisory})
              findings = [dict(items) for items in {tuple(sorted(f.items())) for f in findings}]
              findings.sort(key=lambda f: (f['level'] != 'error', not f.get('introduced', False), f['path'], f['rule'], f['line']))
              errors = sum(f['level'] == 'error' for f in findings)
              summary = ['# Repository source guard', '', 'Version: ' + VERSION, 'Commit: `' + sha + '`', '',
                         '%d text files verified; %d exact dependency versions checked; %d blocking findings.' % (scanned, 0, errors),
                         '0 known vulnerability advisory IDs (external dependency advisory lookups are delegated, not performed here).',
                         '%d dependency coordinates parsed locally; only the separate package-content worker checks proven public coordinates and archives.' % len(deps), '',
                         ('Compared with `' + base_sha + '`: %d changed paths; %d new review findings.' % (len(changed), sum(f.get('introduced', False) for f in findings))) if before is not None else 'Full current-tree scan; no prior-commit comparison for this event.', '',
                         'Checks include bounded literal decoding, behavior correlations, lifecycle scripts and CI configuration. Review warnings are not proof of malicious intent.', '',
                         'Repository code, lifecycle scripts and dependencies were not executed or installed.',
                         'This is a static source and lifecycle check. Dependency advisories and package archives require the separate package-content result; this source-only result does not establish dependency coverage.', '', '## Findings', '']
              for f in findings[:150]:
                  summary.append('- **%s%s** %s:%d — %s' % (f['level'], ' NEW' if f.get('introduced') else '', markdown_safe(f['path']), f['line'], markdown_safe(f['rule'])))
              if len(findings) > 150:
                  summary.append('- Additional findings omitted from this summary: %d.' % (len(findings) - 150))
              if not findings:
                  summary.append('No source indicators were detected by the current rules.')
              summary += ['', '## Vulnerability advisory IDs', '', 'Not queried here; delegated to the provenance-verified package-content worker.', '',
                          'Scope: selected source/configuration text up to 2 MB; secrets excluded; binary programs, submodules, other refs and unpinned/unsupported dependencies are not fully covered. Minified source is included. Decoding is limited to 2 layers, 32 literals and 1 MB per source file. Dependency package archives and registry provenance are not inspected. Heuristic correlations are not full interprocedural data-flow analysis.']
              return '\n'.join(summary), errors
          
          
          def main():
              api = API(os.environ['GH_TOKEN'])
              repo = os.environ['GITHUB_REPOSITORY']
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo):
                  raise RuntimeError('Invalid repository name')
              with open(os.environ['GITHUB_EVENT_PATH']) as file:
                  event = json.load(file)
              if event.get('deleted'):
                  return
              sha = event.get('pull_request', {}).get('head', {}).get('sha') or os.environ['GITHUB_SHA']
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise RuntimeError('Invalid target commit')
              details_url = 'https://github.com/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
              api.gh('repos/' + repo + '/statuses/' + sha, {'state': 'pending', 'context': CHECK_NAME, 'description': 'Static source and dependency review in progress', 'target_url': details_url})
              check = api.gh('repos/' + repo + '/check-runs', {'name': CHECK_NAME, 'head_sha': sha, 'status': 'in_progress', 'details_url': details_url})
              try:
                  summary, errors = run(api, repo, sha, event)
              except Exception as exc:
                  summary, errors = '# Repository source guard\n\nScan incomplete. Error type: ' + type(exc).__name__ + '. No clean result can be reported.', 1
                  print('Source guard failed: ' + type(exc).__name__, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as file:
                  file.write(summary + '\n')
              api.gh('repos/' + repo + '/check-runs/' + str(check['id']), {'status': 'completed', 'conclusion': 'failure' if errors else 'success', 'output': {'title': 'Review required' if errors else 'Source checks completed', 'summary': summary[:60000]}}, method='PATCH')
              api.gh('repos/' + repo + '/statuses/' + sha, {'state': 'failure' if errors else 'success', 'context': CHECK_NAME, 'description': 'Review required' if errors else 'Static source and dependency review passed', 'target_url': details_url})
              print('Source checks completed; blocking findings: ' + str(errors), flush=True)
              if errors:
                  sys.exit(1)
          
          
          
          import types
          import ssl
          _BUNDLED_SCANNER = types.SimpleNamespace(API=API, run=run)
          HOST = 'api.pushover.net'
          ENDPOINT = '/1/messages.json'
          class NotificationError(Exception):
              """Only constant, non-sensitive messages may reach the workflow log."""
          
          def report_counts(summary):
              # v2 lists the first 150 findings, all errors first, and states how many were
              # omitted. Count advisory IDs separately; aliases are not unique CVEs.
              blocking = re.search(r'^\d+ text files verified; \d+ exact dependency versions checked; (\d+) blocking findings\.$', summary, re.M)
              advisories = re.search(r'^(\d+) known vulnerability advisory IDs ', summary, re.M)
              if not summary.startswith('# Repository source guard\n') or not blocking or not advisories:
                  raise NotificationError('The scan report has no complete result counts.')
              if not summary.rstrip().endswith('Heuristic correlations are not full interprocedural data-flow analysis.'):
                  raise NotificationError('The scan report was truncated or its format changed.')
              section = summary.split('## Findings\n', 1)[1].split('\n## Vulnerability advisory IDs', 1)[0]
              levels = re.findall(r'^- \*\*(error|warning)(?: NEW)?\*\* ', section, re.M)
              omitted = re.findall(r'^- Additional findings omitted from this summary: (\d+)\.$', section, re.M)
              total = len(levels) + (int(omitted[0]) if len(omitted) == 1 else 0)
              errors = int(blocking.group(1))
              if len(omitted) > 1 or errors > total or (not omitted and levels.count('error') != errors):
                  raise NotificationError('The scan report has inconsistent counts.')
              return {'warnings': total - errors, 'advisories': int(advisories.group(1)), 'blocking': errors}
          
          def malware_signals(summary):
              """Allow only explicit malicious-package matches and narrow code indicators.
          
              General CVE/GHSA vulnerability counts, age, CI weaknesses and obfuscation
              alone never qualify. Repository text is parsed as data, never executed.
              """
              section = summary.split('## Findings\n', 1)[1].split('\n## Vulnerability advisory IDs', 1)[0]
              grouped, dependencies = {}, set()
              visible_errors = 0
              for line in section.splitlines():
                  match = re.fullmatch(r'- \*\*(error|warning)(?: NEW)?\*\* ("(?:[^"\\]|\\.)*"):\d+ — ("(?:[^"\\]|\\.)*")', line)
                  if not match:
                      if line.startswith('- **error'):
                          raise NotificationError('A blocking finding could not be classified safely.')
                      continue
                  if match[1] != 'error':
                      continue
                  visible_errors += 1
                  path, rule = json.loads(match[2]), json.loads(match[3])
                  for _ in range(8):
                      cleaned = re.sub(r'^(?:decoded-content:|lifecycle:[^:]+:)', '', rule, count=1)
                      if cleaned == rule:
                          break
                      rule = cleaned
                  if rule.startswith(('decoded-content:', 'lifecycle:')):
                      raise NotificationError('Finding nesting exceeds the classification limit.')
                  if re.fullmatch(r'known-malicious-dependency:(?:MAL-\d{4}-\d+|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})', rule):
                      dependencies.add(rule)
                  grouped.setdefault(path, set()).add(rule)
              if visible_errors < report_counts(summary)['blocking']:
                  raise NotificationError('Omitted blocking findings require manual malware review.')
              signatures, behavior = set(), set()
              narrow = {'blockchain-addressed-loader-review', 'shell-reverse-connection',
                        'socket-shell-redirection', 'php-request-shell-execution'}
              encoded_execution = {'hidden-node-process', 'encoded-code-execution', 'php-encoded-execution',
                                   'encoded-function-execution', 'decoded-variable-execution'}
              for path, rules in grouped.items():
                  if {'known-loader-marker', 'obfuscated-code'} <= rules:
                      signatures.add(path)
                  if rules & narrow or ('obfuscated-code' in rules and rules & encoded_execution):
                      behavior.add(path)
              return {'known_loader': bool(signatures), 'malicious_dependency': bool(dependencies),
                      'strong_behavior': bool(behavior)}
          
          def send_notification(fields, token, user):
              if not all(re.fullmatch(r'[A-Za-z0-9]{30}', value or '') for value in (token, user)):
                  raise NotificationError('Configure PUSHOVER_APP_TOKEN and PUSHOVER_USER_KEY as GitHub Actions secrets.')
              body = urllib.parse.urlencode(dict(fields, token=token, user=user)).encode('utf-8')
              connection = None
              try:
                  # Fixed HTTPS destination, verified TLS, no proxy/environment routing and
                  # no redirect handler. A redirect can never forward these credentials.
                  connection = http.client.HTTPSConnection(HOST, timeout=20, context=ssl.create_default_context())
                  connection.request('POST', ENDPOINT, body=body, headers={
                      'Content-Type': 'application/x-www-form-urlencoded',
                      'User-Agent': 'Stellar-Source-Guard-Notifier/1.2',
                  })
                  response = connection.getresponse()
                  if response.status != 200:
                      # Do not log response bodies, URLs, headers or exception details.
                      raise NotificationError('Pushover rejected the notification; check configuration or account quota.')
                  data = response.read(65537)
                  if len(data) > 65536:
                      raise NotificationError('Pushover response exceeded the permitted size.')
                  result = json.loads(data)
                  if not isinstance(result, dict) or type(result.get('status')) is not int or result['status'] != 1:
                      raise NotificationError('Pushover did not confirm acceptance of the notification.')
              except NotificationError:
                  raise
              except Exception:
                  # A timeout can occur after the service accepted the POST. Retrying
                  # automatically could send duplicates; report uncertain delivery instead.
                  raise NotificationError('Notification delivery could not be confirmed. No automatic retry was made.') from None
              finally:
                  if connection is not None:
                      try:
                          connection.close()
                      except Exception:
                          pass
          _BUNDLED_NOTIFIER = types.SimpleNamespace(report_counts=report_counts, malware_signals=malware_signals, send_notification=send_notification)
          """Trusted per-commit source analysis. Target repository code is data only."""
          import hashlib
          import importlib.util
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.request
          
          WORKER_VERSION = '1.1.0'
          COMMIT_CHECK = 'Repository commit guard'
          COMMIT_WORKFLOW = '.github/workflows/stellar-commit-guard.yml'
          JOB_NAME = 'Repository commit guard execution'
          SCAN_STEP = 'Read exact commit and inspect source and lifecycle scripts'
          RESULT_PREFIX = 'STELLAR_COMMIT_GUARD_RESULT='
          SCANNER_DIGEST = 'd44f5fcf1f70c2239cb60352b43d29691dab865fb25ea9eaf6f7f9afa80375b4'
          NOTIFIER_DIGEST = '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c'
          ORGANIZATIONS = frozenset(('StellerSecurity', 'Stellar-seo-websites', 'StellarMail', 'StellarSecurity-Packages'))
          HASH40 = re.compile(r'[0-9a-f]{40}')
          REQUEST_ID = re.compile(r'(?:[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})')
          
          
          class GuardError(Exception):
              """Exception details are never emitted by the entry point."""
          
          
          def load_dependencies():
              if '_BUNDLED_SCANNER' in globals() and '_BUNDLED_NOTIFIER' in globals():
                  return _BUNDLED_SCANNER, _BUNDLED_NOTIFIER
              root = pathlib.Path(__file__).resolve().parent
              modules = []
              for name, pin in [('source_guard', SCANNER_DIGEST), ('pushover_notify', NOTIFIER_DIGEST)]:
                  source = root / (name + '.py')
                  raw = source.read_bytes()
                  if hashlib.sha256(raw).hexdigest() != pin:
                      raise GuardError('Pinned source changed')
                  import types
                  module = types.ModuleType('commit_guard_' + name)
                  module.__file__ = str(source)
                  exec(compile(raw, str(source), 'exec', dont_inherit=True), module.__dict__)
                  modules.append(module)
              return tuple(modules)
          
          
          def positive_integer(value):
              return type(value) is int and 0 < value < 10**20
          
          
          def context(env, event):
              if env.get('GITHUB_EVENT_NAME') != 'workflow_dispatch' or not isinstance(event, dict):
                  raise GuardError('Dispatch required')
              repo = env.get('GITHUB_REPOSITORY', '')
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]{1,100}', repo) or repo.split('/')[0] not in ORGANIZATIONS:
                  raise GuardError('Repository outside scope')
              repository = event.get('repository', {})
              branch = repository.get('default_branch')
              if repository.get('full_name') != repo or not isinstance(branch, str) or not branch or any(c in branch for c in '\r\n\0'):
                  raise GuardError('Repository identity missing')
              if env.get('GITHUB_REF') != 'refs/heads/' + branch:
                  raise GuardError('Trusted default branch required')
              inputs = event.get('inputs', {})
              target, request = inputs.get('target_sha'), inputs.get('request_id')
              execution = env.get('GITHUB_SHA', '')
              if (not isinstance(target, str) or not HASH40.fullmatch(target) or not HASH40.fullmatch(execution)
                      or target == '0' * 40 or execution == '0' * 40):
                  raise GuardError('Invalid commit')
              if not isinstance(request, str) or not REQUEST_ID.fullmatch(request):
                  raise GuardError('Invalid request')
              ids = []
              for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'):
                  value = env.get(key, '')
                  if not re.fullmatch(r'[1-9][0-9]{0,19}', value):
                      raise GuardError('Invalid execution identity')
                  ids.append(int(value))
              return {'repository': repo, 'target_sha': target, 'execution_sha': execution,
                      'request_id': request, 'run_id': ids[0], 'run_attempt': ids[1],
                      'workflow_path': COMMIT_WORKFLOW, 'scanner_sha256': SCANNER_DIGEST,
                      'notifier_sha256': NOTIFIER_DIGEST,
                      'worker_version': WORKER_VERSION, 'schema_version': 1}
          
          
          def external_id(ctx):
              return 'commit-guard:' + ctx['request_id'] + ':' + str(ctx['run_id']) + ':' + str(ctx['run_attempt'])
          
          
          class NoCheckRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise GuardError('Redirect refused')
          
          
          class CheckAPI:
              """Fixed GitHub destination, bounded replies and no mutation retries."""
              def __init__(self, token):
                  if not token:
                      raise GuardError('GitHub token unavailable')
                  self.token = token
                  self.opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoCheckRedirect())
          
              def request(self, path, data=None, method='GET'):
                  if not re.fullmatch(r'repos/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/check-runs(?:/[1-9][0-9]*)?', path):
                      raise GuardError('Unexpected check endpoint')
                  if method not in ('GET', 'POST', 'PATCH'):
                      raise GuardError('Unexpected check method')
                  request = urllib.request.Request('https://api.github.com/' + path,
                      data=None if data is None else json.dumps(data).encode(), method=method,
                      headers={'Authorization': 'Bearer ' + self.token, 'Accept': 'application/vnd.github+json',
                               'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28',
                               'User-Agent': 'Stellar-Commit-Guard/' + WORKER_VERSION})
                  with self.opener.open(request, timeout=30) as response:
                      body = response.read(1024 * 1024 + 1)
                  if len(body) > 1024 * 1024:
                      raise GuardError('Check response too large')
                  result = json.loads(body)
                  if not isinstance(result, dict):
                      raise GuardError('Invalid check response')
                  return result
          
          
          def check_identity(check, ctx, check_id=None):
              if not isinstance(check, dict) or not positive_integer(check.get('id')):
                  raise GuardError('Missing check identity')
              if check_id is not None and check['id'] != check_id:
                  raise GuardError('Wrong check identity')
              if (check.get('name') != COMMIT_CHECK or check.get('head_sha') != ctx['target_sha']
                      or check.get('app', {}).get('id') != 15368
                      or check.get('external_id') != external_id(ctx)):
                  raise GuardError('Check binding mismatch')
          
          
          def scan_commit(ctx, scanner, notifier, source_api, checks):
              record = dict(ctx, state='incomplete', check_id=None, summary_sha256=None, conclusion='failure')
              prefix = 'repos/' + ctx['repository'] + '/check-runs'
              url = 'https://github.com/' + ctx['repository'] + '/actions/runs/' + str(ctx['run_id']) + '/attempts/' + str(ctx['run_attempt'])
              try:
                  check = checks.request(prefix, {'name': COMMIT_CHECK, 'head_sha': ctx['target_sha'],
                      'external_id': external_id(ctx), 'status': 'in_progress', 'details_url': url}, 'POST')
                  check_identity(check, ctx)
                  record['check_id'] = check['id']
                  # Release source-only run() scans this exact tree, not GITHUB_SHA or a checkout.
                  summary, errors = scanner.run(source_api, ctx['repository'], ctx['target_sha'], {})
                  if not isinstance(summary, str) or len(summary.encode()) > 60000 or type(errors) is not int or errors < 0:
                      raise GuardError('Incomplete scanner summary')
                  if not summary.startswith('# Repository source guard\n') or '\nVersion: 2.1.0\n' not in summary or '\nCommit: `' + ctx['target_sha'] + '`\n' not in summary:
                      raise GuardError('Scanner target mismatch')
                  counts = notifier.report_counts(summary)
                  if counts['blocking'] != errors:
                      raise GuardError('Scanner count mismatch')
                  # A report with unclassifiable/truncated errors is not declared clean.
                  signals = notifier.malware_signals(summary)
                  conclusion = 'failure' if errors else 'success'
                  final = checks.request(prefix + '/' + str(check['id']), {'status': 'completed', 'conclusion': conclusion,
                      'output': {'title': 'Commit source analysis completed', 'summary': summary}}, 'PATCH')
                  check_identity(final, ctx, check['id'])
                  if final.get('status') != 'completed' or final.get('conclusion') != conclusion or final.get('output', {}).get('summary') != summary:
                      raise GuardError('Completed report not confirmed')
                  record.update(state='complete', conclusion=conclusion, summary_sha256=hashlib.sha256(summary.encode()).hexdigest(),
                                blocking=errors, malware=signals)
                  return record, 1 if errors else 0, summary
              except Exception:
                  # Do not repeat a possibly accepted write or print exception/response data.
                  return record, 1, '# Commit guard\n\nAnalysis incomplete; no clean result can be reported.\n'
          
          
          def validate_record(record, ctx):
              if not isinstance(record, dict) or any(record.get(k) != v for k, v in ctx.items()):
                  raise GuardError('Result execution binding mismatch')
              if (not positive_integer(record.get('run_id')) or not positive_integer(record.get('run_attempt'))
                      or type(record.get('schema_version')) is not int):
                  raise GuardError('Invalid result identity types')
              if record.get('state') != 'complete' or not positive_integer(record.get('check_id')):
                  raise GuardError('No complete analysis result')
              if not re.fullmatch(r'[0-9a-f]{64}', record.get('summary_sha256') or ''):
                  raise GuardError('Invalid report digest')
              if type(record.get('blocking')) is not int or record['blocking'] < 0:
                  raise GuardError('Invalid result counts')
              if record.get('conclusion') != ('failure' if record['blocking'] else 'success'):
                  raise GuardError('Invalid result conclusion')
              signals = record.get('malware')
              if (not isinstance(signals, dict) or set(signals) != {'known_loader', 'malicious_dependency', 'strong_behavior'}
                      or any(type(value) is not bool for value in signals.values())):
                  raise GuardError('Invalid malware classification types')
          
          
          def notify_commit(ctx, record, notifier, checks, token, user):
              validate_record(record, ctx)
              check = checks.request('repos/' + ctx['repository'] + '/check-runs/' + str(record['check_id']))
              check_identity(check, ctx, record['check_id'])
              summary = check.get('output', {}).get('summary')
              if (check.get('app', {}).get('id') != 15368 or check.get('status') != 'completed'
                      or check.get('conclusion') != record['conclusion'] or not isinstance(summary, str)
                      or len(summary.encode()) > 60000 or hashlib.sha256(summary.encode()).hexdigest() != record['summary_sha256']):
                  raise GuardError('Unverified completed report')
              if '\nVersion: 2.1.0\n' not in summary or '\nCommit: `' + ctx['target_sha'] + '`\n' not in summary:
                  raise GuardError('Report target/version mismatch')
              counts = notifier.report_counts(summary)
              signals = notifier.malware_signals(summary)
              if counts['blocking'] != record['blocking'] or signals != record.get('malware'):
                  raise GuardError('Report classification mismatch')
              if not any(signals.values()):
                  return 'quiet'
              if ctx['run_attempt'] != 1:
                  return 'rerun-notification-suppressed'
              label = ('KENDT MALWARE I DEPENDENCY' if signals['malicious_dependency'] else
                       'KENDT MALWARESIGNATUR' if signals['known_loader'] else 'MULIG MALWARE/SPYWARE')
              fields = {'title': '🚨 ' + label + ' – ' + ctx['repository'].split('/')[1],
                        'message': ctx['repository'] + '\nCommit: ' + ctx['target_sha'][:12] +
                                   '\nFund i denne commit-version; den kan være historisk. Se rapporten for kontrol.',
                        'url': 'https://github.com/' + ctx['repository'] + '/actions/runs/' + str(ctx['run_id']) + '/attempts/' + str(ctx['run_attempt']),
                        'url_title': 'Se commit-scanningen', 'priority': '0', 'html': '0'}
              notifier.send_notification(fields, token, user)
              return 'accepted'
          
          
          def emit_record(record, env):
              encoded = json.dumps(record, separators=(',', ':'), sort_keys=True)
              if len(encoded) > 8192 or '\n' in encoded:
                  raise GuardError('Result record too large')
              with open(env['GITHUB_OUTPUT'], 'a') as file:
                  file.write('result=' + encoded + '\n')
              print(RESULT_PREFIX + encoded, flush=True)
          
          
          def main():
              try:
                  if len(sys.argv) != 2 or sys.argv[1] not in ('scan', 'notify'):
                      raise GuardError('Unexpected mode')
                  event_path = pathlib.Path(os.environ['GITHUB_EVENT_PATH'])
                  if event_path.stat().st_size > 2_000_000:
                      raise GuardError('Event too large')
                  ctx = context(os.environ, json.loads(event_path.read_text()))
                  scanner, notifier = load_dependencies()
                  checks = CheckAPI(os.environ.get('GH_TOKEN', ''))
                  if sys.argv[1] == 'scan':
                      record, status, summary = scan_commit(ctx, scanner, notifier, scanner.API(os.environ['GH_TOKEN']), checks)
                      emit_record(record, os.environ)
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as file:
                          file.write(summary + '\n')
                      return status
                  raw = os.environ.get('COMMIT_GUARD_RESULT', '')
                  if not raw or len(raw) > 8192:
                      raise GuardError('No bounded scan output')
                  record = json.loads(raw)
                  if record.get('state') != 'complete':
                      print('No complete scan result; no malware notification sent.', flush=True)
                      return 1
                  outcome = notify_commit(ctx, record, notifier, checks,
                                          os.environ.get('PUSHOVER_APP_TOKEN', ''), os.environ.get('PUSHOVER_USER_KEY', ''))
                  print('Commit guard notification: ' + outcome + '.', flush=True)
                  return 0
              except Exception:
                  print('::error::Commit guard operation could not be verified; no clean result is asserted.', flush=True)
                  return 1
          
          
          if __name__ == '__main__':
              sys.exit(main())
          STELLAR_COMMIT_GUARD_PY
